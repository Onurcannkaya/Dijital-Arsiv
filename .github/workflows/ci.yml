name: Faz 0 doğrulama

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-zero-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - name: Yüksek ve kritik npm bağımlılık açıklarını reddet
        run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Python servis test bağımlılıkları
        run: |
          python -m pip install --disable-pip-version-check -r services/content-scan/requirements.txt
          python -m pip install --disable-pip-version-check fastapi==0.116.1 pydantic==2.11.7 Pillow==11.3.0 pypdfium2==4.30.0 numpy==2.2.6 opencv-python-headless==4.11.0.86
      - name: Üç Python servisinin birim/regresyon testleri
        shell: bash
        run: |
          (cd services/content-scan && python -m unittest discover -s tests -p 'test_*.py')
          (cd services/ocr && python -m unittest discover -s tests -p 'test_*.py')
          (cd services/document-render && python -m unittest discover -s tests -p 'test_*.py')
      - name: Yerel sır dosyası sızıntısını reddet
        shell: bash
        run: |
          if test -n "$(git ls-files '.dev.vars*' '.env*' ':(exclude).env.example')"; then
            echo "Yerel ortam/sır dosyaları sürüm kontrolünde olmamalı" >&2
            git ls-files '.dev.vars*' '.env*' ':(exclude).env.example'
            exit 1
          fi

  # Kurum içi API imajı (P6): derlenebilirlik + konteyner içi açılış smoke'u.
  # Yerel geliştirme makinesinde Docker olmayabilir; bu iş tek doğrulama kapısıdır.
  node-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Kurum içi compose birleştirme sözleşmesi
        run: >-
          docker compose
          -f deploy/kurum-ici/docker-compose.yml
          -f deploy/kurum-ici/docker-compose.sso.yml
          -f deploy/kurum-ici/docker-compose.tls.yml
          -f deploy/kurum-ici/docker-compose.release.yml
          config --no-interpolate --quiet
      - name: API imajını derle
        run: docker build -f server/Dockerfile -t sivas-arsiv-api:ci .
      - name: API salt-okunur konteyner açılış smoke testi
        shell: bash
        run: |
          docker run -d --name arsiv-api --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --tmpfs /veri:rw,noexec,nosuid,nodev,size=64m,uid=1000,gid=1000,mode=0700 \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 18788:8788 \
            -e ARCHIVE_S3_ENDPOINT=https://minio.ci.invalid \
            -e ARCHIVE_S3_ACCESS_KEY_ID=ci \
            -e ARCHIVE_S3_SECRET_ACCESS_KEY=ci-secret-0123456789 \
            -e ARCHIVE_S3_BUCKET_ARCHIVE=arsiv-asil \
            sivas-arsiv-api:ci
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18788/api/health || echo 000)
            case "$code" in 200|503) break ;; esac
            sleep 1
          done
          docker logs arsiv-api
          echo "health: $code"
          # 503 beklenen durumdur: dış servisler smoke ortamında yoktur.
          case "$code" in 200|503) exit 0 ;; *) exit 1 ;; esac
      - name: UI imajını derle ve salt-okunur sağlık kontrolünü çalıştır
        shell: bash
        run: |
          docker build -f server/ui.Dockerfile -t sivas-arsiv-ui:ci .
          docker run -d --name arsiv-ui --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=64m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 13000:3000 sivas-arsiv-ui:ci
          status=1
          for _ in $(seq 1 30); do
            if docker exec arsiv-ui node ui-healthcheck.mjs; then
              status=0
              break
            fi
            sleep 1
          done
          docker logs arsiv-ui
          test "$status" -eq 0
