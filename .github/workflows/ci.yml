name: Faz 0 doğrulama

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase-zero-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Yerel sır dosyası sızıntısını reddet
        shell: bash
        run: |
          if test -n "$(git ls-files '.dev.vars*' '.env*' ':(exclude).env.example')"; then
            echo "Yerel ortam/sır dosyaları sürüm kontrolünde olmamalı" >&2
            git ls-files '.dev.vars*' '.env*' ':(exclude).env.example'
            exit 1
          fi
