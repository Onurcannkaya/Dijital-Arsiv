# Kurum TLS sınırı. Bu kaplama açıldığında kimlik vekilinin düz HTTP portu
# ana makineden kaldırılır; dışarıya yalnız sertifikalı TLS edge çıkar.
#
# docker compose -f docker-compose.yml -f docker-compose.sso.yml \
#   -f docker-compose.tls.yml up -d

name: sivas-arsiv

services:
  proxy:
    ports: !override []

  tls-edge:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    mem_limit: ${TLS_EDGE_MEMORY_LIMIT:-256m}
    cpus: ${TLS_EDGE_CPU_LIMIT:-0.5}
    pids_limit: ${TLS_EDGE_PIDS_LIMIT:-256}
    depends_on:
      - proxy
    ports:
      - "${ARCHIVE_TLS_PORT:-443}:8443"
    environment:
      ARCHIVE_CANONICAL_HOST: ${ARCHIVE_CANONICAL_HOST:?}
    volumes:
      - ./tls/nginx.tls.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ${ARCHIVE_TLS_CERT_FILE:?}:/run/tls/tls.crt:ro
      - ${ARCHIVE_TLS_KEY_FILE:?}:/run/tls/tls.key:ro
    networks: [arsiv-ic]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://127.0.0.1:8443/oauth2/ping"]
      interval: 30s
      timeout: 5s
      retries: 5
