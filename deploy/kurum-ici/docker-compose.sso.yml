# Kurum içi port P5 — SSO kaplaması (oauth2-proxy + Keycloak).
#
#   docker compose -f docker-compose.yml -f docker-compose.sso.yml up -d --build
#
# Gerektirir: docker compose >= 2.24 (`!override` birleştirme etiketi).
#
# - `proxy` servisi SSO'lu nginx şablonuyla değiştirilir: kimlik başlığını
#   yalnız oauth2-proxy doğrulaması verir; kabul koşusu jetonlu geçitten geçer.
# - `oauth2-proxy` kurumun Keycloak'ına (ya da OIDC sunan başka kimlik
#   sağlayıcısına) bağlanır; SSO_ISSUER_URL .env'de tanımlanır.
# - `keycloak` YALNIZ pilot/deneme içindir ve `--profile kimlik-yerel` ile
#   açılır; kurumda mevcut Keycloak/AD varsa bu profil hiç başlatılmaz.

name: sivas-arsiv

services:
  proxy:
    depends_on:
      - api
      - ui
      - oauth2-proxy
    volumes: !override
      - ./sso/nginx.sso.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./sso/validate-edge-env.sh:/opt/sivas-arsiv/validate-edge-env.sh:ro
    entrypoint: ["/bin/sh", "/opt/sivas-arsiv/validate-edge-env.sh"]
    command: ["nginx", "-g", "daemon off;"]
    environment:
      APP_ENV: ${APP_ENV:?}
      # Yalnız staging kabul ortamında enabled + >=32 karakter jeton.
      # Production doğrulaması enabled değerini ve dolu jetonu reddeder.
      ARCHIVE_ACCEPTANCE_BYPASS_ENABLED: ${ARCHIVE_ACCEPTANCE_BYPASS_ENABLED:-disabled}
      ACCEPTANCE_PROXY_TOKEN: ${ACCEPTANCE_PROXY_TOKEN:-}
      # Yönlendirme şeması istemci başlığından alınmaz. Üretimde yalnız https.
      ARCHIVE_EXTERNAL_SCHEME: ${ARCHIVE_EXTERNAL_SCHEME:-https}

  oauth2-proxy:
    image: ${OAUTH2_PROXY_IMAGE:-quay.io/oauth2-proxy/oauth2-proxy:v7.6.0}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    mem_limit: ${OAUTH2_PROXY_MEMORY_LIMIT:-512m}
    cpus: ${OAUTH2_PROXY_CPU_LIMIT:-0.5}
    pids_limit: ${OAUTH2_PROXY_PIDS_LIMIT:-256}
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${SSO_ISSUER_URL:?}      # ör. https://kimlik.sivas.bel.tr/realms/sivas-arsiv
      OAUTH2_PROXY_CLIENT_ID: ${SSO_CLIENT_ID:-arsiv-vekil}
      OAUTH2_PROXY_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?}
      OAUTH2_PROXY_COOKIE_SECRET: ${SSO_COOKIE_SECRET:?}     # openssl rand -base64 32 | tr -- '+/' '-_'
      OAUTH2_PROXY_REDIRECT_URL: ${SSO_REDIRECT_URL:?}       # https://arsiv.sivas.bel.tr/oauth2/callback
      OAUTH2_PROXY_EMAIL_DOMAINS: ${SSO_EMAIL_DOMAINS:-sivas.bel.tr}
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      # TLS'siz pilot denemesinde "false" yapılabilir; üretimde true kalır.
      OAUTH2_PROXY_COOKIE_SECURE: ${SSO_COOKIE_SECURE:-true}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${SSO_ALLOWED_REDIRECT_DOMAINS:?}
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    networks: [arsiv-ic]

  # Pilot Keycloak — yalnız `--profile kimlik-yerel` ile açılır. Kurumsal
  # kurulum: mevcut Keycloak'a sso/keycloak/sivas-arsiv-realm.json içe
  # aktarılır ve AD/LDAP federasyonu bağlanır (sso/README.md).
  keycloak:
    profiles: [kimlik-yerel]
    image: ${KEYCLOAK_IMAGE:-quay.io/keycloak/keycloak:26.0}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 60s
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-2g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-2.0}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-512}
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
    volumes:
      - ./sso/keycloak:/opt/keycloak/data/import:ro
      - keycloak-veri:/opt/keycloak/data/h2
    ports:
      - "${KEYCLOAK_PORT:-8081}:8081"
    networks: [arsiv-ic]

volumes:
  keycloak-veri:
