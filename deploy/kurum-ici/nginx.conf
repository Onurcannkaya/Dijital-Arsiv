# Kurum içi port P5/P6 — kimlik sınırı ters vekili.
#
# GÜVENLİK SÖZLEŞMESİ: uygulama `oai-authenticated-user-email` başlığına
# koşulsuz güvenir. Bu yüzden:
#   1) İstemciden gelen oai-* başlıkları HER durumda silinir (sahtecilik
#      kapanır);
#   2) Başlığı yalnız kimlik katmanı (SSO) doğrulama SONRASI enjekte eder;
#   3) API'ye vekil dışından ağ erişimi olmamalıdır (compose ağı bunu sağlar).
#
# Aşağıdaki auth_request bloğu P5'te kurumun SSO'suna (ör. oauth2-proxy +
# Keycloak/Active Directory) bağlanana kadar KAPALIDIR; kapalıyken vekil
# kimliksiz istekleri 401 ile keser. Pilot davranışını bilerek isteyen
# ortamlar X-Pilot-Identity haritasını kullanabilir (aşağıya bakın).

map $http_x_pilot_identity $pilot_identity {
    default "";
    # Kapalı tutulur. Pilot denemesi için bilinçli olarak açılacaksa:
    # "onayli-pilot" "pilot-kullanici@sivas.bel.tr";
}

server {
    listen 8080;
    server_name _;

    # 2 GiB'a kadar belge kabulü: gövde diske tamponlanmadan akar.
    client_max_body_size 2g;
    proxy_request_buffering off;
    proxy_http_version 1.1;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # --- P5: SSO doğrulaması buraya bağlanır (oauth2-proxy örneği) ---
        # auth_request /oauth2/auth;
        # auth_request_set $sso_email $upstream_http_x_auth_request_email;

        # İstemciden gelen kimlik başlıkları KOŞULSUZ silinir.
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header oai-authenticated-user-full-name-encoding "";

        # SSO bağlandığında: proxy_set_header oai-authenticated-user-email $sso_email;
        # SSO bağlanana kadar yalnız bilinçli pilot haritası kimlik verebilir.
        proxy_set_header oai-authenticated-user-email $pilot_identity;

        # Kanonik ana bilgisayar: localhost yerel-pilot dolgusunu kapalı tutar.
        proxy_set_header Host $host;
        proxy_pass http://api:8788;
    }
}
